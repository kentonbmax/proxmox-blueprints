---
- name: Install Docker Compose Plugin and Add Docker's GPG Key
  hosts: webservers
  become: yes  # Use sudo to run commands as root
  tasks:

    # Step 3: Install required dependencies
    - name: Install dependencies for Docker (Ubuntu/Debian)
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present

    - name: Create directory for Docker apt keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key to /etc/apt/keyrings/docker.asc
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Set up Docker repository
      shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null


    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Update system packages and clean up
      apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - docker-ce-cli
          - docker-ce
        state: present

    # Step 6: Install Docker Compose Plugin (v2)
    - name: Install Docker Compose plugin via APT
      apt:
        name: docker-compose-plugin
        state: present

    # Step 7: Start and enable Docker service
    - name: Ensure Docker service is started and enabled
      shell: |
        sudo systemctl start docker
        

    # Step 8: Verify Docker Compose plugin installation
    - name: Verify Docker Compose plugin installation
      command: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      debug:
        msg: "Docker Compose version is: {{ compose_version.stdout }}" 
    
    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
        state: present  

    - name: Verify user is in docker group
      command: groups {{ ansible_user }}
      register: user_groups
      changed_when: false   

    - name: Deploy registry container
      docker_container:
        name: registry
        image: registry:3
        state: started
        restart_policy: always
        ports:
          - "5000:5000"
        volumes:
          - /opt/registry/data:/var/lib/registry
        published_ports:
